<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <h1>❌ Tic-Tac-Toe ⭕</h1>
        
        <div class="game-info">
            <div class="players">
                <div class="player p1 active">
                    <span class="icon">❌</span>
                    <span>Joueur 1</span>
                    <span class="score" id="score1">0</span>
                </div>
                <div class="player p2">
                    <span class="icon">⭕</span>
                    <span>Joueur 2</span>
                    <span class="score" id="score2">0</span>
                </div>
            </div>
            <button id="reset-btn">🔄 Nouvelle partie</button>
        </div>

        <div id="status">Tour de : ❌ Joueur 1</div>

        <div class="board" id="board">
            <!-- 9 cases -->
        </div>

        <div class="history">
            <button id="undo-btn">↩️ Annuler</button>
            <button id="reset-score-btn">📊 Réinitialiser les scores</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
